# The Quiz Pit — camera relay container.
#
# Linux hosts: network_mode: host keeps ICE simple — real interfaces, no
# port mapping, and the config's webrtcIPsFromInterfaces just works.
# (Only UDP 8189 is genuinely new exposure; 8889/8888 stay unexposed and
# are reached only through the reverse proxy.)
#
# Windows/macOS Docker Desktop has no host networking: replace network_mode
# with
#   ports: ["8189:8189/udp", "127.0.0.1:8889:8889", "127.0.0.1:8888:8888"]
# and in mediamtx.yml set:
#   webrtcIPsFromInterfaces: false
#   webrtcAdditionalHosts: ["<the host's public IP>"]

services:
  mediamtx:
    image: bluenviron/mediamtx:v1.21.2
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
